name: CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.21.0

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate workflow security contracts
        run: |
          pnpm workflow:validate
          pnpm exec eslint .github/scripts scripts/validate-workflows.mjs
      - name: Check repository formatting
        run: pnpm format:check
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify direct Web deployment build
        run: pnpm --filter @hzense/web build
      - name: Build workspace
        run: pnpm build
      - name: Run unit tests
        run: pnpm test
      - name: Verify isolated parser with synthetic documents
        run: |
          python3 -m venv "$RUNNER_TEMP/import-parser-venv"
          "$RUNNER_TEMP/import-parser-venv/bin/pip" install -r packages/ingestion/parser-requirements.txt
          HZENSE_PARSER_TEST_PYTHON="$RUNNER_TEMP/import-parser-venv/bin/python3" node --test packages/ingestion/test/import-parser.test.mjs
      - name: Verify built administrator authentication with isolated fixtures
        working-directory: apps/web
        env:
          HZENSE_ADMIN_AUTH_INTEGRATION: '1'
        run: node --test test/admin-auth-runtime.test.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify import workbench with isolated browser fixtures
        run: HZENSE_IMPORT_BROWSER_TEST=1 node --test apps/web/test/admin-import-browser.test.mjs apps/web/test/admin-controls-browser.test.mjs
      - name: Verify private signal generation with isolated browser fixtures
        run: HZENSE_SIGNAL_GENERATION_BROWSER_TEST=1 node --test apps/web/test/admin-signal-generation-browser.test.mjs
      - name: Verify candidate publication materials with isolated browser fixtures
        run: HZENSE_CANDIDATE_REVIEW_BROWSER_TEST=1 node --test apps/web/test/candidate-review-browser.test.mjs apps/web/test/candidate-material-workflow-browser.test.mjs
      - name: Run production browser smoke tests
        run: pnpm test:e2e
      - name: Validate Topic authority and content integrity
        run: pnpm content:validate
      - name: Validate Taxonomy, Seed and Radar data
        run: pnpm seed:validate
      - name: Summarize foundation gate
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Foundation gate'
            echo "- Result: $JOB_STATUS"
            echo "- Node.js: $NODE_VERSION"
            echo "- pnpm: $PNPM_VERSION"
            echo '- Checks: format, audit, lint, typecheck, build, unit, browser, Taxonomy, content and Seed'
          } >> "$GITHUB_STEP_SUMMARY"

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify restricted-role migrations, Topic sync, Runtime reader and production contracts
        env:
          MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          RUNTIME_READER_TEST_ISOLATED_CLUSTER: '1'
        run: pnpm --filter @hzense/database test:migrations
      - name: Build search dependency for configured administrator fixture
        run: pnpm --filter @hzense/search build
      - name: Verify publication material queries with isolated PostgreSQL
        env:
          HZENSE_CANDIDATE_REVIEW_SQL_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          RUNTIME_READER_TEST_ISOLATED_CLUSTER: '1'
        run: node --test apps/web/test/candidate-review-confirmation.test.mjs
      - name: Install Chromium for configured administrator fixture
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify AI provider presets and endpoint guidance without external calls
        working-directory: apps/web
        env:
          HZENSE_AI_GUIDANCE_BROWSER_TEST: '1'
        run: node --test test/admin-ai-guidance-browser.test.mjs test/admin-ai-profiles-browser.test.mjs
      - name: Verify private read-only Signal workbench without external calls
        working-directory: apps/web
        env:
          HZENSE_SIGNAL_WORKBENCH_BROWSER_TEST: '1'
        run: node --test test/admin-signal-workbench-browser.test.mjs
      - name: Verify configured AI forms through HTTP and isolated PostgreSQL
        working-directory: apps/web
        env:
          HZENSE_AI_BROWSER_PG_TEST: '1'
          MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          RUNTIME_READER_TEST_ISOLATED_CLUSTER: '1'
        run: node --test test/admin-ai-browser-pg.test.mjs
      - name: Summarize migration gate
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Database migration gate'
            echo "- Result: $JOB_STATUS"
            echo '- Matrix: restricted migrator, Topic writer and Runtime reader; full schema contract, idempotent reruns, lock contention, privilege isolation, legacy upgrade and rollback'
            echo '- Configured AI: real React forms, HTTP handler and restricted PostgreSQL store; synthetic provider only, separate from Next.js/Google authentication verification'
            echo '- Service: PostgreSQL 18 + administrator-preinstalled pgvector 0.8.6 (digest pinned)'
          } >> "$GITHUB_STEP_SUMMARY"

  daily-publication-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'daily-candidate-validation' || 'daily-publication-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Topic authority, Daily structure and evidence
        run: pnpm content:validate
      - name: Require a human publication state
        if: github.event_name != 'workflow_dispatch'
        run: pnpm daily:publication-check
      - name: Summarize Daily gate
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Daily publication gate'
            echo "- Result: $JOB_STATUS"
            echo "- Event: $EVENT_NAME"
            echo "- Check context: ${{ github.event_name == 'workflow_dispatch' && 'daily-candidate-validation' || 'daily-publication-gate' }}"
          } >> "$GITHUB_STEP_SUMMARY"
