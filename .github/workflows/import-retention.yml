name: Private import original retention
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
permissions:
  contents: read
  actions: read
concurrency:
  group: private-import-retention
  cancel-in-progress: false
jobs:
  retention:
    if: github.ref == 'refs/heads/main' && (vars.HZENSE_IMPORT_RETENTION_ENABLED == '1' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare without production credentials
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
          pnpm workflow:validate
      - name: Require current main and passing CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$GITHUB_SHA"
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')"
          test "$result" = success
      - name: Clean abandoned temporary originals
        env:
          HZENSE_IMPORT_RETENTION_ENABLED: ${{ vars.HZENSE_IMPORT_RETENTION_ENABLED }}
          HZENSE_IMPORT_BLOB_STORE_ID: ${{ vars.HZENSE_IMPORT_BLOB_STORE_ID }}
          HZENSE_IMPORT_BLOB_TOKEN: ${{ secrets.HZENSE_IMPORT_BLOB_TOKEN }}
          IMPORT_RETENTION_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        run: node .github/scripts/import-retention.mjs
