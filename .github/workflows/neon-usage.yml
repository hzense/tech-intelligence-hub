name: Neon network usage sampling

on:
  schedule:
    # Berlin midnight is 22:00 UTC in summer and 23:00 UTC in winter.
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-network-usage-sampling
  cancel-in-progress: false

jobs:
  sample:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.NEON_USAGE_MONITOR_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select Berlin midnight schedule
        id: midnight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          offset="$(TZ=Europe/Berlin date +%z)"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ||
                ( "$SCHEDULE_CRON" == '0 22 * * *' && "$offset" == '+0200' ) ||
                ( "$SCHEDULE_CRON" == '0 23 * * *' && "$offset" == '+0100' ) ]]; then
            echo 'sample=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sample=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Request a bounded Neon usage sample
        if: steps.midnight.outputs.sample == 'true'
        shell: bash
        env:
          HZENSE_NEON_USAGE_CRON_SECRET: ${{ secrets.HZENSE_NEON_USAGE_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [[ ${#HZENSE_NEON_USAGE_CRON_SECRET} -lt 32 || "$HZENSE_NEON_USAGE_CRON_SECRET" =~ [[:space:][:cntrl:]] ]]; then
            echo 'Neon usage sampling secret is missing or invalid.' >&2
            exit 1
          fi

          umask 077
          request_dir="$(mktemp -d)"
          trap 'rm -rf "$request_dir"' EXIT
          printf 'Authorization: Bearer %s\n' "$HZENSE_NEON_USAGE_CRON_SECRET" > "$request_dir/headers"
          unset HZENSE_NEON_USAGE_CRON_SECRET

          if ! http_status="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 55 \
            --max-filesize 16384 \
            --request POST \
            --header "@$request_dir/headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            'https://hzense.com/api/internal/neon-usage')"; then
            echo 'Neon usage sampling request failed.' >&2
            exit 1
          fi

          if [[ "$http_status" != '200' ]]; then
            echo 'Neon usage sampling did not return HTTP 200; inspect the protected dashboard.' >&2
            exit 1
          fi

          {
            echo '## Neon network usage sampling'
            echo '- Sampling endpoint returned HTTP 200.'
            echo '- Check /admin/dashboard for the last saved sample and data coverage.'
            echo '- This run does not query business tables or call AI.'
          } >> "$GITHUB_STEP_SUMMARY"
