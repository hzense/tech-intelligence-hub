name: Production database health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Exercise the incident path after a successful production health probe
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-database-health
  cancel-in-progress: false

jobs:
  database-health:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.PRODUCTION_DATABASE_HEALTH_ENABLED == 'true')
    outputs:
      probe_succeeded: ${{ steps.production_probe.outputs.succeeded }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production database health contract
        id: production_probe
        shell: bash
        env:
          HEALTH_URL: https://hzense.com/api/health/database
        run: |
          set -euo pipefail

          response_dir="$(mktemp -d)"
          trap 'rm -rf "$response_dir"' EXIT
          body_file="$response_dir/body"
          expected_file="$response_dir/expected"
          headers_file="$response_dir/headers"
          metrics_file="$response_dir/metrics"

          if ! curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 8 \
            --dump-header "$headers_file" \
            --output "$body_file" \
            --write-out '%{http_code}\n%{time_total}\n' \
            "$HEALTH_URL" > "$metrics_file"; then
            echo 'Production database health request failed.' >&2
            exit 1
          fi

          mapfile -t metrics < "$metrics_file"
          if [[ "${#metrics[@]}" -ne 2 ]]; then
            echo 'curl returned an unexpected metrics payload.' >&2
            exit 1
          fi

          http_status="${metrics[0]}"
          total_seconds="${metrics[1]}"
          if [[ "$http_status" != '200' ]]; then
            echo "Expected HTTP 200, received HTTP $http_status." >&2
            exit 1
          fi
          if [[ ! "$total_seconds" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo 'curl returned an invalid total time.' >&2
            exit 1
          fi

          printf '%s' '{"status":"ok"}' > "$expected_file"
          if ! cmp --silent "$expected_file" "$body_file"; then
            echo 'Health response body did not exactly match the public contract.' >&2
            exit 1
          fi

          cache_control="$(
            awk '
              tolower($0) ~ /^cache-control:/ {
                line = tolower($0)
                sub(/^[^:]*:[[:space:]]*/, "", line)
                sub(/\r$/, "", line)
                print line
                exit
              }
            ' "$headers_file"
          )"
          normalized_cache_control="$(printf '%s' "$cache_control" | tr -d '[:space:]')"
          if [[ ",$normalized_cache_control," != *',no-store,'* ]]; then
            echo 'Cache-Control is missing the no-store directive.' >&2
            exit 1
          fi

          if ! awk -v total_seconds="$total_seconds" \
            'BEGIN { exit !(total_seconds >= 0 && total_seconds < 8) }'; then
            echo "Health request took ${total_seconds}s; expected less than 8s." >&2
            exit 1
          fi

          {
            echo '## Production database health'
            echo '- Result: healthy'
            echo "- HTTP status: $http_status"
            echo "- Total time: ${total_seconds}s"
            echo '- Contract: exact body and no-store cache policy verified'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'succeeded=true' >> "$GITHUB_OUTPUT"

      - name: Exercise controlled alert path
        if: inputs.test_alert == true
        shell: bash
        run: |
          echo 'Controlled production health alert test requested.' >&2
          exit 1

  health-incident:
    needs: database-health
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.PRODUCTION_DATABASE_HEALTH_ENABLED == 'true'))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile production health incident
        shell: bash
        env:
          ALERT_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEALTH_RESULT: ${{ needs.database-health.result }}
          PROBE_SUCCEEDED: ${{ needs.database-health.outputs.probe_succeeded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ALERT: ${{ inputs.test_alert || false }}
        run: |
          set -euo pipefail

          case "$HEALTH_RESULT" in
            failure | success)
              ;;
            cancelled | skipped)
              echo "No incident transition for database-health result: $HEALTH_RESULT." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "Unsupported database-health result: $HEALTH_RESULT." >&2
              exit 1
              ;;
          esac

          incident_title='Production database health monitor incident'
          incident_marker='<!-- hzense-production-database-health -->'
          incident="$(
            gh api \
              --paginate \
              "repos/$GH_REPO/issues?state=all&per_page=100" \
              --jq '.[] | select((has("pull_request") | not) and .user.login == "github-actions[bot]" and .title == "Production database health monitor incident" and ((.body // "") | contains("<!-- hzense-production-database-health -->"))) | [.number, .state] | @tsv' \
              | awk 'NR == 1 { print }'
          )"
          IFS=$'\t' read -r incident_number incident_state <<< "$incident"

          if [[ "$HEALTH_RESULT" == 'failure' ]]; then
            if [[ "$TEST_ALERT" == 'true' && "$PROBE_SUCCEEDED" == 'true' ]]; then
              incident_summary='A controlled alert-path test was requested after a successful production health probe.'
            else
              incident_summary='The production database health workflow reported a failed probe.'
            fi
            issue_body="$(
              printf '%s\n\n%s\n\nLatest workflow run: %s\n\nNotification: @%s' \
                "$incident_marker" \
                "$incident_summary" \
                "$RUN_URL" \
                "$ALERT_ACTOR"
            )"

            if [[ -z "$incident_number" ]]; then
              gh issue create \
                --repo "$GH_REPO" \
                --title "$incident_title" \
                --body "$issue_body"
              exit 0
            fi

            if [[ "${incident_state,,}" == 'closed' ]]; then
              gh issue reopen "$incident_number" --repo "$GH_REPO"
            fi
            gh issue edit "$incident_number" --repo "$GH_REPO" --body "$issue_body"
            exit 0
          fi

          if [[ "$HEALTH_RESULT" == 'success' && -n "$incident_number" && "${incident_state,,}" == 'open' ]]; then
            gh issue comment "$incident_number" \
              --repo "$GH_REPO" \
              --body "Production database health recovered. Workflow run: $RUN_URL"
            gh issue close "$incident_number" --repo "$GH_REPO" --reason completed
          fi
