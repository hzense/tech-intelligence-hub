version: '2.0.0'
project: HZense

id_policy:
  format: '<type>-<slug>'
  case: lowercase
  separator: '-'
  stable_after_publish: true
  public_id_required: true

content_types:
  daily:
    required: [id, title, type, status, date, language]
    fields:
      signal_count: integer
      major_developments: integer
      rising_topics: topic_id[]
  weekly:
    required: [id, title, type, status, week, start_date, end_date]
    fields:
      signal_count: integer
      daily_refs: content_id[]
      featured_topics: topic_id[]
  insight:
    required: [id, title, type, status, date, importance]
    fields:
      topics: topic_id[]
      companies: entity_id[]
      technologies: entity_id[]
      evidence_signals: signal_id[]
  briefing:
    required: [id, title, type, status, date]
    fields:
      topics: topic_id[]
      technologies: entity_id[]
      importance: '1..5'
  topic:
    required: [id, title, type, status]
    fields:
      parent: topic_id|null
      attention: '0..100'
      trend: [rapid_growth, growth, stable, decline, rapid_decline]
      maturity: [research, early, emerging, growth, mature]
      strategic_value: [low, medium, high, critical]
  paper_note:
    description: HZense analysis or notes about a paper; distinct from the objective paper entity.
    required: [id, title, type, status, date, paper]
    fields:
      paper: entity_id
      topics: topic_id[]
      importance: '1..5'
      related_entities: entity_id[]

entity_types:
  person:
    required: [id, type, name, status]
    fields: [aliases, role, organizations, location, research_areas, topics, website]
  company:
    required: [id, type, name, status]
    fields: [aliases, country, founded, website, categories, technologies, products]
  institution:
    required: [id, type, name, institution_type, status]
    fields: [aliases, country, city, website, topics]
  technology:
    required: [id, type, name, status]
    fields: [aliases, category, description, topics]
  product:
    required: [id, type, name, status]
    fields: [aliases, company, product_type, technologies, topics, website]
  model:
    description: Named AI/ML or computational model distinct from the commercial product wrapping it.
    required: [id, type, name, status]
    fields:
      [
        aliases,
        developer,
        model_family,
        modalities,
        release_date,
        license,
        technologies,
        topics,
        website,
      ]
  dataset:
    description: Dataset, benchmark corpus, evaluation set, or structured research data asset.
    required: [id, type, name, status]
    fields: [aliases, creators, dataset_type, domain, release_date, license, size, topics, website]
  standard_protocol:
    description: Technical standard, protocol, specification, interface, or interoperability framework.
    required: [id, type, name, status]
    fields:
      [aliases, maintainers, standard_type, version, release_date, technologies, topics, website]
  paper:
    description: Objective scholarly work entity; HZense commentary belongs in paper_note content.
    required: [id, type, name, status]
    fields: [title, authors, institutions, published_at, venue, doi, arxiv_id, topics, url]
  event:
    description: Conference, launch event, policy hearing, competition, expo, or other time-bounded technology event.
    required: [id, type, name, status]
    fields: [aliases, event_type, starts_at, ends_at, location, organizer, topics, website]

relation_model:
  required: [id, source, relation_type, target, confidence]
  directed: true
  allowed_types:
    - works_at
    - founded
    - leads
    - advises
    - invests_in
    - acquired
    - invested_in
    - partnered_with
    - competes_with
    - supplies
    - customer_of
    - develops
    - owns
    - uses
    - integrates
    - commercializes
    - employs
    - researches
    - created
    - collaborates_with
    - authored_by
    - published_by
    - supports
    - challenges
    - related_to
    - mentions
    - influences
    - depends_on
    - part_of
    - trained_on
    - evaluated_on
    - implements
    - conforms_to
    - successor_of
    - version_of
    - presented_at
    - organized_by
    - announced_at

signal_model:
  required:
    [
      id,
      title,
      type,
      occurred_at,
      captured_at,
      status,
      source_id,
      source_url,
      summary,
      importance,
      strength,
      confidence,
      novelty,
    ]
  types:
    [
      research,
      product,
      funding,
      acquisition,
      hiring,
      policy,
      technology,
      market,
      people,
      open_source,
      security,
      patent,
      partnership,
      regulation,
      supply_chain,
    ]
  statuses: [inbox, reviewed, accepted, rejected, archived]
  scales:
    importance: '1..5'
    strength: '1..5'
    confidence: '0.0..1.0'
    novelty: '0.0..1.0'
  radar_eligible_statuses: [reviewed, accepted]
  source_url: exact_event_page_https

source_model:
  required: [id, name, type, trust_score, active, allowed_hosts]
  types:
    [
      website,
      rss,
      paper,
      company_blog,
      research_lab,
      news_media,
      newsletter,
      github,
      social,
      regulator,
      patent_database,
    ]
  allowed_hosts: publisher_or_authorized_distributor_hostname[]

radar_model:
  required:
    [
      id,
      topic,
      date,
      domain,
      attention,
      trend,
      maturity,
      strategic_value,
      confidence,
      evidence_signals,
      reasoning,
    ]
  domain: [artificial_intelligence, infrastructure, security, robotics]
  attention: '0..100'
  trend: [rapid_growth, growth, stable, decline, rapid_decline]
  maturity: [research, early, emerging, growth, mature]
  strategic_value: [low, medium, high, critical]
  confidence: '0.0..1.0'
  evidence_signals: ordered_non_empty_signal_id[]
  reasoning: non_empty_editorial_text
  time_series: true

search_document:
  derived: true
  source_of_truth: false
  required: [id, source_id, source_type, title, body, importance, date]
  fields: [topics, entities, embedding_ref]

taxonomy_model:
  source_of_truth: data/taxonomy/taxonomy.yaml
  authoritative_fields: [id, name, primary_parent, cross_domain_relations]
  seed_projection:
    path: data/seed/topics.yaml
    subset: true
    authoritative_fields: [status]
  content_projection:
    root: content/topics
    recursive: true
    formats: [md, mdx]
    subset_of_seed: true
    covers_all_non_archived_seed_topics: true
    localized_title: true
  database_projection:
    table: topics
    coverage: complete_taxonomy
    table_status: implemented
    schema_migration: db/migrations/0002_topic_projection.sql
    production_schema_migration_status: independently_verified_2026_08_31
    synchronization_status: implemented
    synchronizer_implemented: true
    production_sync_status: independently_verified_2026_08_31
    independently_editable: false
    column_sources:
      id: taxonomy.id
      title: taxonomy.name
      parent_id: taxonomy.primary_parent
      status:
        seed_topic: seed.status
        taxonomy_only_fallback: watching
      runtime_enabled: seed_member_and_status_not_archived
    content_gate:
      required_before_write: true
      localized_content_synchronized: false
    cross_domain_relations:
      storage: taxonomy_yaml_only
      database_synchronized: false
    write_contract:
      default_mode: dry_run
      dry_run_persistence: rollback_after_write_verification
      transaction: single
      advisory_lock: migration_namespace
      allowed_operations: [insert, update]
      delete_allowed: false
      unknown_database_ids: fail_closed
      production_role: hzense_topic_sync
      fingerprints:
        source: authoritative_projection
        plan: source_plus_current_managed_database_fields_and_insert_update_noop_sets
        dry_run_outputs: [source, plan]
        production_apply_check: after_advisory_and_table_lock_before_write
      production_apply_requires:
        [exact_source_fingerprint, exact_plan_fingerprint, operator_verified_backup_declaration]
      backup_declaration:
        environment: HZENSE_TOPIC_SYNC_BACKUP_ID
        meaning: operator_verified_new_recoverable_backup
        cli_validation: presence_and_format_only
        provider_verification_by_cli: false
        log_field: productionBackupDeclarationProvided
        log_contains_backup_id: false
      role_preflight:
        public_schema_access: exact_allowlist
        other_non_system_schema_access: forbidden
        executable_security_definer_routines_in_non_system_schemas: forbidden
        all_non_system_schema_checks:
          [effective_relation_privileges, column_privileges, sequence_privileges, ownership]
      role_configuration:
        script: db/roles/configure_topic_sync.sql
        role: hzense_topic_sync
        role_preprovisioned_by: provider_or_local_cluster_administrator
        contains_credentials: false
        executor: current_database_and_migration_object_owner
        target_database_resolution: quoted_current_database
        migration_prerequisite: 0002_topic_projection.sql
        advisory_lock: migration_namespace
        atomic: true
        public_database_revocations: [connect, create, temporary]
        public_schema_revocations: [usage, create]
        migration_owner_default_acl_scope: all_schemas_plus_public_overlays
        allowed_direct_privileges:
          database: [connect]
          schema_public: [usage]
          type_topic_status: [usage]
          hzense_schema_migrations: [select]
          topics: [select, insert, update]
        local_requires_same_restricted_role: true
        owner_or_migrator_url_accepted_by_sync_preflight: false
        production_maintenance_window:
          full_verify_then_role_config_then_dry_run_apply: same_window
          owner_migrator_ddl: frozen
      commands:
        local_dry_run: db:sync:topics:local:dry-run
        local_apply: db:sync:topics:local:apply
        production_dry_run: db:sync:topics:production:dry-run
        production_apply: db:sync:topics:production:apply
      production_environment:
        connection: HZENSE_TOPIC_SYNC_DATABASE_URL
        expected_identity:
          [
            HZENSE_TOPIC_SYNC_EXPECTED_HOST,
            HZENSE_TOPIC_SYNC_EXPECTED_PORT,
            HZENSE_TOPIC_SYNC_EXPECTED_NAME,
            HZENSE_TOPIC_SYNC_EXPECTED_USER,
            HZENSE_TOPIC_SYNC_EXPECTED_POSTGRES_MAJOR,
            HZENSE_TOPIC_SYNC_EXPECTED_CONNECTION_LIMIT,
          ]
        apply_guard:
          [
            HZENSE_TOPIC_SYNC_EXPECTED_FINGERPRINT,
            HZENSE_TOPIC_SYNC_EXPECTED_PLAN_FINGERPRINT,
            HZENSE_TOPIC_SYNC_BACKUP_ID,
          ]

runtime_reader:
  status:
    repository_implementation: prepared_pending_merge
    neon_baseline_governance: prepared_with_live_evidence
    target_database_acl: not_executed
    independent_runtime_credential: not_executed
    production_preflight: not_executed
    vercel_production_environment: not_executed
    production_redeployment: not_executed
    health_and_bounded_read_acceptance: not_executed
    safe_log_and_monitoring_acceptance: not_executed
  role:
    name: hzense_runtime
    attributes:
      [login, noinherit, nosuperuser, nocreatedb, nocreaterole, noreplication, nobypassrls]
    connection_limit: 20
    memberships:
      local_and_nonproduction: none
      production_neon_control_plane:
        exact_count: 1
        granted_role: hzense_runtime
        member: neondb_owner
        grantor: cloud_admin
        admin_option: true
        inherit_option: false
        set_option: false
        purpose: provider_role_administration_only
        accepted_residual: provider_admin_can_regrant_role
      all_other_incoming_or_outgoing_memberships: forbidden
      drift_behavior: fail_closed
    default_transaction_read_only: true
  web_pool:
    environment: production_only
    maximum_connections_per_process: 1
    lazy_initialization: request_only
  target_database_allowlist:
    database: [connect]
    schema_public: [usage]
    type_topic_status: [usage]
    topics_columns:
      select: [id, title, parent_id, status, runtime_enabled]
    temporary: forbidden
    relation_writes: forbidden
    application_ddl: forbidden
    grant_option: forbidden
    object_ownership: forbidden
    routine_execute:
      application_routines: forbidden
      security_definer: forbidden
      direct_runtime_acl: forbidden
      pgvector_security_invoker:
        ordinary_contract: routine_owner_equals_extension_owner
        production_neon_provider_contract:
          enabled_by: production_runner_after_neon_pooler_and_tls_verification
          extension_name: vector
          extension_version: 0.8.6
          routine_owner: cloud_admin
          extension_owner: neondb_owner
          routine_count: 118
          public_routine_count: 118
          approved_routine_owner_count: 118
          executable_routine_count: 118
          public_execute_count: 118
          security_definer_count: 0
          grantable_count: 0
          direct_runtime_acl_count: 0
        drift_behavior: fail_closed
  cross_database_policy:
    ordinary_non_target_databases: no_connect_create_or_temporary
    template0: must_remain_non_connectable
    neon_reserved_exceptions:
      matching: exact_contract_not_name_only
      owner: cloud_admin
      databases:
        postgres:
          template: false
          connection_limit: -1
          database_acl_shape: default_null
          public_privileges: [connect, temporary]
          create: forbidden
        template1:
          template: true
          connection_limit: -1
          database_acl_shape: explicit
          public_privileges: [connect]
          create: forbidden
      both_require: [no_grant_option, no_direct_runtime_acl, runtime_identity, read_only, tls]
      deep_checks: [login_event_triggers, non_system_object_access, non_system_object_ownership]
      drift_behavior: fail_closed
  neon_baseline_governance:
    backup:
      type: provider_branch
      retention_days: 7
      created: '2026-08-31'
      identifier_recorded_in_repository: false
      expires_before_acceptance_requires_replacement: true
    role_and_database_acl_inventory: complete
    runtime_read_only_default: complete
    ordinary_neondb_public_acl_isolation: complete
    target_hzense_acl: pending
  migration_operations:
    role: hzense_migrator
    scope: maintenance_only
    connection_limit: 10
    previous_connection_limit: 5
    rationale: neon_tables_exhausted_old_limit_and_triggered_53300
    runtime_privilege_impact: none
    further_increase_requires_connection_source_audit: true
  production_acceptance_requires:
    - merged_green_repository_change
    - independently_rotated_runtime_credential
    - target_acl_applied_and_verified
    - target_and_reserved_database_preflight_passed
    - production_only_vercel_environment
    - ready_deployment_for_merged_commit
    - health_200_exact_ok_no_store
    - real_bounded_five_column_read
    - safe_runtime_logs
    - monitoring_baseline_verified
  rollback:
    before_acl: protected_pre_change_acl_record_and_current_provider_branch
    before_vercel: do_not_inject_environment_until_preflight_passes
    failed_deployment:
      [
        remove_runtime_production_environment,
        redeploy_last_known_good_commit,
        rotate_runtime_credential,
      ]
    abandoned_acl_rollout: restore_reviewed_pre_change_acl_or_provider_branch

data_consistency:
  - all_ids_unique
  - all_relation_endpoints_must_exist
  - taxonomy_topic_ids_must_be_unique
  - taxonomy_primary_parent_must_be_unique_and_acyclic
  - taxonomy_relation_endpoints_must_exist
  - seed_topics_must_match_taxonomy_ids_and_names
  - content_topics_must_match_seed_status
  - content_topic_parent_must_match_taxonomy_when_present
  - all_public_topic_refs_must_resolve_to_non_archived_seed_topics
  - database_topics_must_cover_complete_taxonomy
  - database_topic_identity_and_parent_must_match_taxonomy
  - database_topic_status_must_use_seed_or_watching_fallback
  - database_topic_runtime_enabled_must_match_seed_membership_and_status
  - database_topic_unknown_ids_must_fail_closed
  - database_topic_sync_must_never_delete
  - database_topic_sync_rerun_must_be_noop
  - public_signals_must_not_reference_archived_topics
  - radar_snapshots_must_not_reference_archived_topics
  - paper_entity_and_paper_note_content_must_use_distinct_ids
  - rejected_signals_cannot_affect_radar
  - radar_evidence_signals_must_exist_and_be_unique
  - radar_evidence_signals_must_be_reviewed_or_accepted
  - radar_evidence_signals_must_match_topic_and_snapshot_date
  - signal_source_urls_must_be_https
  - signal_source_url_host_must_match_source_allowlist
  - archived_entities_are_not_physically_deleted
  - search_and_embeddings_are_rebuildable
  - markdown_and_postgres_align_on_public_id

schema_versioning:
  semantic_versioning: true
  minor_changes: [add_optional_field, add_enum_value, add_entity_type]
  major_changes: [change_id_policy, remove_field, change_source_of_truth]
