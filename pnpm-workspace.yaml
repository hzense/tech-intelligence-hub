packages:
  - 'apps/*'
  - 'packages/*'

# Workflow currently pins older transitive clients/IDs; retain their major API
# while applying the upstream security patches required by the production audit.
overrides:
  # Next 16.4.1 includes the required sharp/librsvg security fixes directly.
  # This Next.js app does not import workflow/nest. Omit its unused Nest adapter
  # and SWC CLI downloader chain (GHSA-ch52-4w7c-c8xp); keep the audit enabled.
  'workflow@4.8.9>@workflow/nest': '-'
  '@workflow/world-local>undici': '7.30.1'
  '@workflow/world-vercel>undici': '7.30.1'
  # Workflow/Vercel pin older Zod 4 minors; keep its major API and patch collection DoS.
  'zod@>=4.0.0 <4.6.6': '4.6.6'
  '@workflow/core>nanoid': '5.1.16'
  # Keep Workflow's devalue 5 API while applying serialization security fixes.
  '@workflow/core>devalue': '5.9.3'
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11. These production
  # consumers use the retained named minimatch/match APIs; keep legacy dev APIs.
  '@vercel/queue>minimatch': '11.0.1'
  '@oclif/core>minimatch': '11.0.1'
  'filelist>minimatch': '11.0.1'
  # minimatch 10 uses brace-expansion 5; patch its recursion/CPU DoS fixes only.
  'minimatch@10>brace-expansion': '5.0.12'
  # Preserve the source-map 1 API and patch indexed-map offset DoS.
  'postcss@8>source-map-js': '1.2.2'
  '@tailwindcss/node>source-map-js': '1.2.2'
  # Patch Express's qs 6 comma-array serialization DoS (GHSA-6pq8-jhm2-2vcw).
  'express@5>qs': '6.16.1'
  # gray-matter uses only js-yaml's library API, not its CLI. Omit the unused
  # argparse 1 -> sprintf-js chain (GHSA-hp3w-g68c-fv3c has no published fix).
  'js-yaml@3.15.2>argparse': '-'

allowBuilds:
  '@swc/core': true
  cbor-extract: false
  esbuild: true
  sharp: true
  unrs-resolver: true
